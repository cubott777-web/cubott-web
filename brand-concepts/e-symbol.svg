    M110 22 A18 18 0 1 1 128 40
    L128 70
    L200.7 112 L200.7 196 L128 238 L55.3 196 L55.3 112 L128 70
    M128 154 L200.7 112
    M128 154 L55.3 112
    M128 154 L128 238
  " />
</svg>
