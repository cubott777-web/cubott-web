<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 512" width="400" height="512" role="img" aria-label="Cubott">
  <!-- Cubott mark: isometric robot cube. Colours are fixed brand values; do not restyle. -->
  <g stroke="#0A2F47" stroke-width="22" stroke-linejoin="round" stroke-linecap="round">
    <!-- left face (shadow) -->
    <polygon points="22,193 200,286 200,500 22,407" fill="#0A3F5E" />
    <!-- front face -->
    <polygon points="200,286 378,193 378,407 200,500" fill="#379ECF" />
    <!-- top face -->
    <polygon points="200,100 378,193 200,286 22,193" fill="#3AA5D8" />
    <!-- antenna: rises from the centre of the top face -->
    <line x1="200" y1="193" x2="200" y2="56" stroke-width="26" stroke-linecap="butt" />
    <circle cx="200" cy="40" r="30" fill="#0A2F47" />
  </g>
  <!-- eyes: ellipses skewed along the front face -->
  <g fill="#0A2F47" transform="skewY(-27.5)">
    <ellipse cx="246" cy="474" rx="21" ry="31" />
    <ellipse cx="328" cy="474" rx="21" ry="31" />
  </g>
</svg>
